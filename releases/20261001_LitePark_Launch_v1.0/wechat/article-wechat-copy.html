<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>复制 LitePark 公众号正文</title><style>body{margin:0;background:#eae6e1;font-family:-apple-system,"PingFang SC",sans-serif}.toolbar{position:sticky;top:0;z-index:2;padding:14px;text-align:center;background:#302a27;color:white}.toolbar button{border:0;border-radius:20px;padding:10px 22px;background:#e88743;color:white;font-weight:700;cursor:pointer}iframe{display:block;width:min(840px,100%);height:calc(100vh - 68px);margin:auto;border:0;background:white}</style></head><body><div class="toolbar">打开下方文章确认排版，然后 <button onclick="copyArticle()">一键复制公众号正文</button> <span id="status">尚未复制</span></div><iframe id="preview" src="article.html"></iframe><script>async function copyArticle(){const frame=document.getElementById('preview');const doc=frame.contentDocument;const content=doc.querySelector('.page');const status=document.getElementById('status');const html=content.outerHTML;const text=content.innerText;try{if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);status.textContent='已复制';return;}}catch(e){}const range=doc.createRange();range.selectNode(content);const selection=frame.contentWindow.getSelection();selection.removeAllRanges();selection.addRange(range);const copied=doc.execCommand('copy');selection.removeAllRanges();status.textContent=copied?'已复制':'复制失败，请打开 article.html 手动全选复制';}</script></body></html>
